{{- if .Values.nodeAgent.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "kybernate.nodeAgent.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kybernate.labels" . | nindent 4 }}
    app.kubernetes.io/component: node-agent
spec:
  selector:
    matchLabels:
      {{- include "kybernate.nodeAgent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kybernate.nodeAgent.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "kybernate.nodeAgent.name" . }}
      {{- with .Values.nodeAgent.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeAgent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeAgent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: node-agent
          image: {{ include "kybernate.nodeAgent.image" . }}
          imagePullPolicy: {{ .Values.nodeAgent.image.pullPolicy }}
          args:
            - --health-addr=:{{ .Values.nodeAgent.healthPort }}
            - --pod-resources-socket={{ .Values.nodeAgent.kubeletPodResourcesPath }}/kubelet.sock
            - --gpu-resources={{ join "," .Values.nodeAgent.gpuResources }}
            {{- with .Values.nodeAgent.devicePlugin }}
            {{- if .enabled }}
            - --device-plugin
            - --device-plugin-dir={{ .path }}
            - --device-plugin-resource={{ .resourceName }}
            - --device-list-strategy={{ .deviceListStrategy }}
            - --cdi-kind={{ .cdiKind }}
            {{- end }}
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # See all GPUs of the node through the NVIDIA runtime without
            # allocating any of them.
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: utility
          ports:
            - name: health
              containerPort: {{ .Values.nodeAgent.healthPort }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            {{- toYaml .Values.nodeAgent.resources | nindent 12 }}
          volumeMounts:
            - name: pod-resources
              mountPath: {{ .Values.nodeAgent.kubeletPodResourcesPath }}
              readOnly: true
            {{- if .Values.nodeAgent.devicePlugin.enabled }}
            - name: device-plugins
              mountPath: {{ .Values.nodeAgent.devicePlugin.path }}
            {{- end }}
          # The kubelet's PodResources socket belongs to root with mode 0755,
          # so only root can connect to it. The agent runs as UID 0 but
          # without any capabilities and without privilege escalation.
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: pod-resources
          hostPath:
            path: {{ .Values.nodeAgent.kubeletPodResourcesPath }}
            type: Directory
        {{- if .Values.nodeAgent.devicePlugin.enabled }}
        - name: device-plugins
          hostPath:
            path: {{ .Values.nodeAgent.devicePlugin.path }}
            type: Directory
        {{- end }}
{{- end }}
