{{- if .Values.nodeAgent.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "kybernate.nodeAgent.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kybernate.labels" . | nindent 4 }}
    app.kubernetes.io/component: node-agent
spec:
  selector:
    matchLabels:
      {{- include "kybernate.nodeAgent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kybernate.nodeAgent.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "kybernate.nodeAgent.name" . }}
      {{- if include "kybernate.leases" . }}
      # cuda-checkpoint and the lookup of a container's processes need the
      # host's PIDs.
      hostPID: true
      {{- end }}
      {{- with .Values.nodeAgent.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeAgent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeAgent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: node-agent
          image: {{ include "kybernate.nodeAgent.image" . }}
          imagePullPolicy: {{ .Values.nodeAgent.image.pullPolicy }}
          args:
            - --health-addr=:{{ .Values.nodeAgent.healthPort }}
            - --pod-resources-socket={{ .Values.nodeAgent.kubeletPodResourcesPath }}/kubelet.sock
            - --gpu-resources={{ join "," .Values.nodeAgent.gpuResources }}
            {{- with .Values.nodeAgent.devicePlugin }}
            {{- if .enabled }}
            - --device-plugin
            - --device-plugin-dir={{ .path }}
            - --device-plugin-resource={{ .resourceName }}
            - --device-list-strategy={{ .deviceListStrategy }}
            - --cdi-kind={{ .cdiKind }}
            - --cdi-spec-dirs={{ .cdiSpecPath }}
            {{- end }}
            {{- end }}
            {{- if include "kybernate.leases" . }}
            {{- with .Values.nodeAgent.leases }}
            - --leases
            - --runtime-class={{ .runtimeClassName }}
            - --lease-resource={{ .resourceName }}
            - --slots-per-gpu={{ .slotsPerGPU }}
            - --nri-socket={{ .nriSocket }}
            - --cuda-checkpoint={{ .cudaCheckpointPath }}
            {{- end }}
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # See all GPUs of the node through the NVIDIA runtime without
            # allocating any of them.
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            # cuda-checkpoint needs libcuda (compute) for the warm tier.
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: {{ if include "kybernate.leases" . }}compute,utility{{ else }}utility{{ end }}
          ports:
            - name: health
              containerPort: {{ .Values.nodeAgent.healthPort }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            {{- toYaml .Values.nodeAgent.resources | nindent 12 }}
          volumeMounts:
            - name: pod-resources
              mountPath: {{ .Values.nodeAgent.kubeletPodResourcesPath }}
              readOnly: true
            {{- if .Values.nodeAgent.devicePlugin.enabled }}
            - name: device-plugins
              mountPath: {{ .Values.nodeAgent.devicePlugin.path }}
            {{- if eq .Values.nodeAgent.devicePlugin.deviceListStrategy "cdi" }}
            # Read only, to check that the CDI specification describes every GPU.
            - name: cdi-specs
              mountPath: {{ .Values.nodeAgent.devicePlugin.cdiSpecPath }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if include "kybernate.leases" . }}
            - name: nri
              mountPath: {{ dir .Values.nodeAgent.leases.nriSocket }}
            - name: cuda-checkpoint
              mountPath: /usr/local/bin/cuda-checkpoint
              readOnly: true
            {{- end }}
          # The kubelet's PodResources socket belongs to root with mode 0755,
          # so only root can connect to it. The agent runs as UID 0 but
          # without privilege escalation. For the warm tier, cuda-checkpoint
          # must reach the processes of other containers: it needs the host's
          # PID namespace, SYS_PTRACE and no AppArmor confinement.
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
              {{- if include "kybernate.leases" . }}
              add: ["SYS_PTRACE"]
            appArmorProfile:
              type: Unconfined
              {{- end }}
      volumes:
        - name: pod-resources
          hostPath:
            path: {{ .Values.nodeAgent.kubeletPodResourcesPath }}
            type: Directory
        {{- if .Values.nodeAgent.devicePlugin.enabled }}
        - name: device-plugins
          hostPath:
            path: {{ .Values.nodeAgent.devicePlugin.path }}
            type: Directory
        {{- if eq .Values.nodeAgent.devicePlugin.deviceListStrategy "cdi" }}
        - name: cdi-specs
          hostPath:
            path: {{ .Values.nodeAgent.devicePlugin.cdiSpecPath }}
            type: DirectoryOrCreate
        {{- end }}
        {{- end }}
        {{- if include "kybernate.leases" . }}
        - name: nri
          hostPath:
            path: {{ dir .Values.nodeAgent.leases.nriSocket }}
            type: Directory
        - name: cuda-checkpoint
          hostPath:
            path: {{ .Values.nodeAgent.leases.cudaCheckpointPath }}
            type: File
        {{- end }}
{{- end }}
