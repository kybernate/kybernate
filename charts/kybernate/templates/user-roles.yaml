apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kybernate-viewer
  labels:
    {{- include "kybernate.labels" . | nindent 4 }}
    {{- if .Values.rbac.aggregateToDefaultRoles }}
    rbac.authorization.k8s.io/aggregate-to-view: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    {{- end }}
rules:
  - apiGroups: ["kybernate.io"]
    resources: ["gpunodes", "gpunodes/status", "gpuworkloads", "gpuworkloads/status"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kybernate-editor
  labels:
    {{- include "kybernate.labels" . | nindent 4 }}
    {{- if .Values.rbac.aggregateToDefaultRoles }}
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    {{- end }}
rules:
  # Change which GPUs are reserved for Kybernate (spec.reservedGPUs) and
  # suspend or resume workloads (spec.state of GPUWorkloads).
  - apiGroups: ["kybernate.io"]
    resources: ["gpunodes", "gpuworkloads"]
    verbs: ["get", "list", "watch", "update", "patch"]
