{{- with .Values.nodeAgent.devicePlugin }}
{{- if and .enabled .admissionPolicy.enabled }}
{{- $name := printf "%s-gpu-access" $.Release.Name | trunc 63 | trimSuffix "-" }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "kybernate.labels" $ | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        !has(object.spec.runtimeClassName) ||
        !(object.spec.runtimeClassName in {{ toJson .admissionPolicy.runtimeClasses }})
      message: >-
        GPUs are allocated by Kybernate. Request nvidia.com/gpu instead of using
        the RuntimeClass of the NVIDIA runtime.
    - expression: >-
        object.spec.containers.all(c, !has(c.env) || c.env.all(e, e.name != 'NVIDIA_VISIBLE_DEVICES')) &&
        (!has(object.spec.initContainers) ||
          object.spec.initContainers.all(c, !has(c.env) || c.env.all(e, e.name != 'NVIDIA_VISIBLE_DEVICES')))
      message: >-
        GPUs are allocated by Kybernate. Request nvidia.com/gpu instead of setting
        NVIDIA_VISIBLE_DEVICES.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "kybernate.labels" $ | nindent 4 }}
spec:
  policyName: {{ $name }}
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            {{- toYaml (uniq (append .admissionPolicy.exemptNamespaces $.Release.Namespace)) | nindent 12 }}
{{- end }}
{{- end }}
