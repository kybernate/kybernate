{{- with .Values.nodeAgent.devicePlugin }}
{{- if and .enabled .admissionPolicy.enabled }}
{{- $name := printf "%s-gpu-access" $.Release.Name | trunc 63 | trimSuffix "-" }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "kybernate.labels" $ | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        !has(object.spec.runtimeClassName) ||
        !(object.spec.runtimeClassName in {{ toJson .admissionPolicy.runtimeClasses }})
      message: >-
        GPUs are allocated by Kybernate. Request nvidia.com/gpu instead of using
        the RuntimeClass of the NVIDIA runtime.
    - expression: >-
        object.spec.containers.all(c, !has(c.env) || c.env.all(e, e.name != 'NVIDIA_VISIBLE_DEVICES')) &&
        (!has(object.spec.initContainers) ||
          object.spec.initContainers.all(c, !has(c.env) || c.env.all(e, e.name != 'NVIDIA_VISIBLE_DEVICES')))
      message: >-
        GPUs are allocated by Kybernate. Request nvidia.com/gpu instead of setting
        NVIDIA_VISIBLE_DEVICES.
    {{- if include "kybernate.leases" $ }}
    {{- $rc := $.Values.nodeAgent.leases.runtimeClassName }}
    {{- $res := $.Values.nodeAgent.leases.resourceName }}
    - expression: >-
        (has(object.spec.runtimeClassName) && object.spec.runtimeClassName == '{{ $rc }}') ||
        object.spec.containers.all(c, !has(c.resources) ||
          ((!has(c.resources.limits) || !('{{ $res }}' in c.resources.limits)) &&
           (!has(c.resources.requests) || !('{{ $res }}' in c.resources.requests))))
      message: >-
        Pods that request {{ $res }} need the RuntimeClass {{ $rc }}.
    - expression: >-
        !has(object.spec.runtimeClassName) || object.spec.runtimeClassName != '{{ $rc }}' ||
        object.spec.containers.all(c, !has(c.resources) ||
          ((!has(c.resources.limits) || !('{{ .resourceName }}' in c.resources.limits)) &&
           (!has(c.resources.requests) || !('{{ .resourceName }}' in c.resources.requests))))
      message: >-
        Pods with the RuntimeClass {{ $rc }} get their GPUs as {{ $res }}, not as {{ .resourceName }}.
    - expression: >-
        !has(object.metadata.annotations) || !('kybernate.io/isolation' in object.metadata.annotations) ||
        object.metadata.annotations['kybernate.io/isolation'] in ['strict', 'migratable']
      message: >-
        The annotation kybernate.io/isolation must be strict or migratable.
    {{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "kybernate.labels" $ | nindent 4 }}
spec:
  policyName: {{ $name }}
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            {{- toYaml (uniq (append .admissionPolicy.exemptNamespaces $.Release.Namespace)) | nindent 12 }}
{{- end }}
{{- end }}
