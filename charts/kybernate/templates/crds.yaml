{{- /*
CRDs are rendered as templates rather than placed in crds/, because Helm
installs CRDs from crds/ only once and never upgrades them. The sources in
files/crds/ are generated by `make manifests`.
*/ -}}
{{- if .Values.crds.install }}
{{- range $path, $_ := .Files.Glob "files/crds/*.yaml" }}
{{- $crd := $.Files.Get $path | fromYaml }}
{{- $annotations := default dict $crd.metadata.annotations }}
{{- if $.Values.crds.keep }}
{{- $_ := set $annotations "helm.sh/resource-policy" "keep" }}
{{- end }}
{{- $_ := set $crd.metadata "annotations" $annotations }}
{{- $_ := set $crd.metadata "labels" (merge (default dict $crd.metadata.labels) (include "kybernate.labels" $ | fromYaml)) }}
---
{{ toYaml $crd }}
{{- end }}
{{- end }}
