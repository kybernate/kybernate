{{- if include "kybernate.leases" . }}
# Pods with this RuntimeClass get GPUs of the Kybernate pool as leases. The
# handler is containerd's regular runc; the node agent injects the GPUs
# through NRI.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ .Values.nodeAgent.leases.runtimeClassName }}
  labels:
    {{- include "kybernate.labels" . | nindent 4 }}
handler: {{ .Values.nodeAgent.leases.runtimeHandler }}
scheduling:
  nodeSelector:
    {{- toYaml .Values.nodeAgent.nodeSelector | nindent 4 }}
{{- end }}
