kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: gpunodes.kybernate.io
spec:
  group: kybernate.io
  names:
    kind: GPUNode
    listKind: GPUNodeList
    plural: gpunodes
    shortNames:
    - gpun
    singular: gpunode
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.gpuCount
      name: GPUs
      type: integer
    - jsonPath: .status.reservedCount
      name: Reserved
      type: integer
    - jsonPath: .status.driverVersion
      name: Driver
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          GPUNode describes the GPUs of one Kubernetes node and which of them belong
          to Kybernate. Its name is the name of the node.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: GPUNodeSpec is the desired state of the GPUs of one node.
            properties:
              reservedGPUs:
                description: |-
                  ReservedGPUs lists the UUIDs of the GPUs that belong to the Kybernate pool.
                  GPUs that are not listed stay available to regular pods.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
            type: object
          status:
            description: GPUNodeStatus is the observed state of the GPUs of one node.
            properties:
              conditions:
                description: Conditions describe the state of the node agent on this
                  node.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              cudaDriverVersion:
                description: CUDADriverVersion is the CUDA version supported by the
                  driver.
                type: string
              driverVersion:
                description: DriverVersion is the NVIDIA driver version of the node.
                type: string
              gpuCount:
                description: GPUCount is the number of GPUs found on the node.
                format: int32
                type: integer
              gpus:
                description: GPUs is the inventory of the node.
                items:
                  description: GPU is the inventory record of one GPU.
                  properties:
                    architecture:
                      description: Architecture is the GPU generation, for example
                        Ampere, Ada, Hopper or Blackwell.
                      type: string
                    computeCapability:
                      description: ComputeCapability is the CUDA compute capability,
                        for example "8.6".
                      type: string
                    index:
                      description: Index is the NVML index of the GPU on its node.
                      format: int32
                      type: integer
                    links:
                      description: Links describes the connections to the other GPUs
                        of the node.
                      items:
                        description: GPULink is the connection from one GPU to another
                          GPU of the same node.
                        properties:
                          nvlinks:
                            description: NVLinks is the number of NVLink connections
                              to the peer, if Type is NVLink.
                            format: int32
                            type: integer
                          p2p:
                            description: P2P reports whether peer-to-peer access between
                              both GPUs is supported.
                            type: boolean
                          peerUUID:
                            description: PeerUUID is the UUID of the other GPU.
                            type: string
                          type:
                            description: Type is the kind of connection.
                            enum:
                            - NVLink
                            - PCIeSwitch
                            - PCIeHostBridge
                            - System
                            type: string
                        required:
                        - peerUUID
                        - type
                        type: object
                      type: array
                      x-kubernetes-list-map-keys:
                      - peerUUID
                      x-kubernetes-list-type: map
                    memoryTotalBytes:
                      description: MemoryTotalBytes is the total VRAM.
                      format: int64
                      type: integer
                    memoryUsedBytes:
                      description: MemoryUsedBytes is the VRAM in use at the time
                        of the last inventory.
                      format: int64
                      type: integer
                    name:
                      description: Name is the product name, for example "NVIDIA RTX
                        A6000".
                      type: string
                    pciBusID:
                      description: PCIBusID is the PCI address of the GPU.
                      type: string
                    pciDeviceID:
                      description: |-
                        PCIDeviceID identifies the GPU chip. A checkpoint can only be restored
                        onto a GPU with the same device ID.
                      type: string
                    state:
                      description: State tells who the GPU currently belongs to.
                      enum:
                      - Free
                      - Regular
                      - Reserved
                      - PendingReservation
                      type: string
                    uuid:
                      description: UUID is the unique identifier of the GPU.
